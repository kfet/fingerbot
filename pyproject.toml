[project]
name = "fingerbot"
version = "0.3.0"
description = "Press a Tuya Fingerbot over BLE. One command, no arguments, standard library only."
requires-python = ">=3.9"
# None, deliberately: the module is deployed by copying one file.
dependencies = []

[project.scripts]
fingerbot = "fingerbot:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fingerbot --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["fingerbot"]

[tool.pyrefly]
# pytest puts tests/ on sys.path (there is no tests/__init__.py), so conftest
# is importable by name at run time; pyrefly needs telling.
search-path = ["src", "tests"]

[tool.ruff]
line-length = 100
# The module must run on any python3 >= 3.9 (it is deployed by copying one
# file), so lint against 3.9 semantics: no zip(strict=), no match, etc.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0,<2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.16.3",
    "ty>=0.0.72,<0.1",
    # Cross-check references for the stdlib AES and Tuya codec. Never runtime.
    "pycryptodome>=3.23.0",
    "tuya-ble>=0.1.0; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/kfet/fingerbot"
Repository = "https://github.com/kfet/fingerbot"
