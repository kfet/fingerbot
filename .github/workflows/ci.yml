name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --python ${{ matrix.python-version }}

      # The gate is defined once, in scripts/check.py: ruff, ty, pyrefly,
      # pytest. CI calls it rather than restating the steps, so local, hook
      # and CI can never drift apart. It names the failing checker itself.
      - name: Gate (ruff, ty, pyrefly, pytest)
        run: uv run --python ${{ matrix.python-version }} scripts/check.py
