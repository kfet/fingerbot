name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        run: uv sync

      # Same single gate definition as ci.yml and the pre-commit hook.
      - name: Gate (ruff, ty, pyrefly, pytest)
        run: uv run scripts/check.py

      - name: Build
        run: uv build

      - name: GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
